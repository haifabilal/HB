
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HB Battle Royale</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  background: #101b27;
  font-family: Arial, sans-serif;
}
#game { width: 100vw; height: 100vh; }
#hud {
  position: fixed;
  top: 15px;
  left: 15px;
  color: white;
  z-index: 2;
  background: #0009;
  padding: 12px;
  border-radius: 12px;
}
#controls {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  z-index: 2;
}
button {
  background: #172c42dd;
  color: white;
  border: 2px solid #8fc9ff;
  border-radius: 12px;
  padding: 16px 22px;
  font-size: 18px;
  touch-action: none;
}
</style>
</head>
<body>

<div id="hud">
  <b>🦢 HB BATTLE ROYALE</b><br>
  Prototype 01<br>
  Player: HB Warrior
</div>

<div id="controls">
  <button id="left">←</button>
  <button id="forward">↑</button>
  <button id="back">↓</button>
  <button id="right">→</button>
</div>

<div id="game"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 35, 100);

const camera = new THREE.PerspectiveCamera(
  70, innerWidth / innerHeight, 0.1, 200
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x42613b, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(15, 25, 10);
sun.castShadow = true;
scene.add(sun);

// Island
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(180, 180),
  new THREE.MeshStandardMaterial({color:0x478b43})
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Ocean
const ocean = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.MeshStandardMaterial({color:0x147db5})
);
ocean.rotation.x = -Math.PI / 2;
ocean.position.y = -0.15;
scene.add(ocean);

// Player
const player = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.CylinderGeometry(0.42, 0.48, 1.3, 12),
  new THREE.MeshStandardMaterial({color:0x243b60})
);
body.position.y = 1;
body.castShadow = true;
player.add(body);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.35, 16, 16),
  new THREE.MeshStandardMaterial({color:0xd7a477})
);
head.position.y = 1.95;
player.add(head);

const helmet = new THREE.Mesh(
  new THREE.SphereGeometry(0.38, 16, 12, 0, Math.PI*2, 0, Math.PI/2),
  new THREE.MeshStandardMaterial({color:0xd6b33e})
);
helmet.position.y = 2.12;
player.add(helmet);

scene.add(player);

// Buildings
function building(x,z,color) {
  const house = new THREE.Mesh(
    new THREE.BoxGeometry(5, 4, 5),
    new THREE.MeshStandardMaterial({color})
  );
  house.position.set(x, 2, z);
  house.castShadow = true;
  house.receiveShadow = true;
  scene.add(house);

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(4, 3, 4),
    new THREE.MeshStandardMaterial({color:0x713b2c})
  );
  roof.position.set(x, 5.5, z);
  roof.rotation.y = Math.PI/4;
  scene.add(roof);
}
building(12,-10,0xc6b18c);
building(-13,-15,0xb4b6a2);
building(16,15,0x9b9d87);
building(-18,12,0xc7a47b);

// Trees
function tree(x,z) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(.25,.4,2,8),
    new THREE.MeshStandardMaterial({color:0x694329})
  );
  trunk.position.set(x,1,z);
  scene.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(2,5,8),
    new THREE.MeshStandardMaterial({color:0x176b35})
  );
  leaves.position.set(x,4,z);
  scene.add(leaves);
}
for(let i=0;i<35;i++){
  const x=(Math.random()-.5)*100;
  const z=(Math.random()-.5)*100;
  if(Math.abs(x)<12 && Math.abs(z)<12) continue;
  tree(x,z);
}

// Controls
const keys={};
const buttons=["left","right","forward","back"];

buttons.forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys[id]=true;
    el.setPointerCapture(e.pointerId);
  });
  ["pointerup","pointercancel","lostpointercapture"].forEach(event=>{
    el.addEventListener(event,()=>keys[id]=false);
  });
});

let cameraAngle=0;

function animate(){
  requestAnimationFrame(animate);

  const speed=0.14;
  let dx=0,dz=0;

  if(keys.forward) dz-=speed;
  if(keys.back) dz+=speed;
  if(keys.left) dx-=speed;
  if(keys.right) dx+=speed;

  player.position.x+=dx;
  player.position.z+=dz;

  player.position.x=THREE.MathUtils.clamp(player.position.x,-75,75);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-75,75);

  if(dx||dz) player.rotation.y=Math.atan2(dx,dz);

  const desired=new THREE.Vector3(
    player.position.x,
    player.position.y+5,
    player.position.z+9
  );
  camera.position.lerp(desired,0.08);
  camera.lookAt(player.position.x,1,player.position.z);

  renderer.render(scene,camera);
}
camera.position.set(0,5,9);
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
