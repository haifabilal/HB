<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HB 18</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial;text-align:center;overflow:hidden;touch-action:none}
h1{margin:8px;color:#50e6c0;letter-spacing:4px}
#stats{display:flex;justify-content:space-around;max-width:560px;margin:8px auto}
.stat{background:#24334b;padding:8px 14px;border-radius:12px;font-weight:bold}
canvas{width:min(94vw,68vh);height:min(94vw,68vh);max-width:600px;max-height:600px;background:#202c43;border:3px solid #50e6c0;border-radius:10px;display:block;margin:auto}
#message{height:22px;color:#ffe17a;font-size:13px;margin:5px}
#controls{display:flex;justify-content:space-between;max-width:440px;margin:8px auto}
.pad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:48px 48px;gap:5px}
button{border:0;border-radius:12px;background:#304867;color:white;font-size:23px;font-weight:bold;touch-action:none}
button:active{background:#50e6c0;color:#102033}
#up{grid-column:2}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#restart{font-size:15px;padding:11px 20px;background:#50e6c0;color:#102033}
#leader{position:absolute;right:8px;top:90px;background:#18263dcc;padding:8px;border-radius:10px;text-align:left;font-size:12px;pointer-events:none}
small{color:#aebbd1}
</style>
</head>
<body>

<h1>HB 18</h1>

<div id="stats">
 <div class="stat">YOUR LAND: <span id="score">0%</span></div>
 <div class="stat">RANK: <span id="rank">1</span></div>
</div>

<canvas id="game" width="600" height="600"></canvas>
<div id="message">Capture land. Avoid enemy trails!</div>
<div id="leader"></div>

<div id="controls">
 <div class="pad">
  <button id="up">↑</button>
  <button id="left">←</button>
  <button id="down">↓</button>
  <button id="right">→</button>
 </div>
 <button id="restart">RESTART</button>
</div>
<small>Capture territory • Defeat opponents • Become No. 1</small>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const N=30,C=20,T=N*N;

const colors=["#24d6ad","#ff5577","#ffcf48","#6e91ff","#bd70ff"];
const names=["YOU","BOT RED","BOT GOLD","BOT BLUE","BOT PURPLE"];

let owners,players,gameOver=false;
let direction={x:1,y:0};
let score=0;
let tick=0;

function id(x,y){return y*N+x}
function inside(x,y){return x>=0&&y>=0&&x<N&&y<N}

function makePlayer(index,x,y,dir){
 return {
  index,x,y,dx:dir.x,dy:dir.y,
  trail:[],alive:true,steps:0,
  color:colors[index],name:names[index]
 };
}

function start(){
 owners=new Int8Array(T);
 owners.fill(-1);
 players=[
  makePlayer(0,15,15,{x:1,y:0}),
  makePlayer(1,4,4,{x:1,y:0}),
  makePlayer(2,25,4,{x:-1,y:0}),
  makePlayer(3,4,25,{x:1,y:0}),
  makePlayer(4,25,25,{x:-1,y:0})
 ];

 players.forEach(p=>{
  for(let y=-2;y<=2;y++){
   for(let x=-2;x<=2;x++){
    const xx=p.x+x,yy=p.y+y;
    if(inside(xx,yy))owners[id(xx,yy)]=p.index;
   }
  }
 });

 direction={x:1,y:0};
 gameOver=false;
 tick=0;
 document.getElementById("message").textContent="Capture land. Avoid enemy trails!";
 draw();
 updateStats();
}

function chooseDirection(p){
 const options=[
  {x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}
 ];

 let possible=options.filter(d=>
  !(d.x===-p.dx&&d.y===-p.dy)&&
  inside(p.x+d.x,p.y+d.y)
 );

 if(!possible.length){
  p.dx=-p.dx;p.dy=-p.dy;
  return;
 }

 // Bots occasionally change direction
 if(Math.random()<0.24||!inside(p.x+p.dx,p.y+p.dy)){
  const safe=possible.filter(d=>owners[id(p.x+d.x,p.y+d.y)]!==p.index);
  const choice=(safe.length?safe:possible)[Math.floor(Math.random()*(safe.length?safe:possible).length)];
  p.dx=choice.x;p.dy=choice.y;
 }
}

function capture(p){
 const blocked=new Uint8Array(T);
 const outside=new Uint8Array(T);
 const queue=new Int32Array(T);
 let head=0,tail=0;

 for(let i=0;i<T;i++)blocked[i]=owners[i]===p.index?1:0;
 for(const cell of p.trail)blocked[cell]=1;

 function add(i){
  if(!blocked[i]&&!outside[i]){
   outside[i]=1;
   queue[tail++]=i;
  }
 }

 for(let x=0;x<N;x++){add(id(x,0));add(id(x,N-1))}
 for(let y=0;y<N;y++){add(id(0,y));add(id(N-1,y))}

 while(head<tail){
  const i=queue[head++];
  const x=i%N,y=Math.floor(i/N);
  if(x>0)add(i-1);
  if(x<N-1)add(i+1);
  if(y>0)add(i-N);
  if(y<N-1)add(i+N);
 }

 for(let i=0;i<T;i++){
  if(!outside[i])owners[i]=p.index;
 }
 p.trail=[];
}

function eliminate(p){
 p.trail=[];
 p.alive=false;

 // Respawn after a short delay
 setTimeout(()=>{
  if(gameOver)return;
  let x,y;
  do{
   x=2+Math.floor(Math.random()*(N-4));
   y=2+Math.floor(Math.random()*(N-4));
  }while(owners[id(x,y)]!==p.index);

  p.x=x;p.y=y;
  p.dx=1;p.dy=0;
  p.alive=true;
 },1000);

 if(p.index===0){
  document.getElementById("message").textContent="Your trail was hit! Respawning...";
 }
}

function move(p){
 if(!p.alive)return;

 if(p.index!==0)chooseDirection(p);

 const nx=p.x+p.dx,ny=p.y+p.dy;
 if(!inside(nx,ny)){
  if(p.index===0){
   eliminate(p);
  }else{
   p.dx=-p.dx;p.dy=-p.dy;
  }
  return;
 }

 const next=id(nx,ny);

 // Own trail collision
 if(p.trail.includes(next)){
  eliminate(p);
  return;
 }

 // A player enters another player's trail
 for(const enemy of players){
  if(enemy===p||!enemy.alive)continue;
  if(enemy.trail.includes(next)){
   eliminate(enemy);
  }
 }

 p.x=nx;p.y=ny;
 p.steps++;

 if(owners[next]===p.index){
  if(p.trail.length)capture(p);
 }else{
  p.trail.push(next);
 }

 // Check if another player hits this player's trail
 for(const enemy of players){
  if(enemy!==p&&enemy.alive&&enemy.trail.includes(id(p.x,p.y))){
   eliminate(enemy);
  }
 }
}

function updateStats(){
 const counts=players.map((p,i)=>owners.filter(v=>v===i).length);
 const myPercent=Math.floor(counts[0]/T*100);
 document.getElementById("score").textContent=myPercent+"%";

 const sorted=[...counts].sort((a,b)=>b-a);
 document.getElementById("rank").textContent=sorted.indexOf(counts[0])+1;

 document.getElementById("leader").innerHTML=
  "<b>LEADERBOARD</b><br>"+
  players.map((p,i)=>({p,count:counts[i]}))
  .sort((a,b)=>b.count-a.count)
  .map(v=>"<span style='color:"+v.p.color+"'>● "+v.p.name+": "+Math.floor(v.count/T*100)+"%</span>")
  .join("<br>");
}

function draw(){
 ctx.clearRect(0,0,600,600);

 // Territory squares
 for(let y=0;y<N;y++){
  for(let x=0;x<N;x++){
   const owner=owners[id(x,y)];
   ctx.fillStyle=owner<0?"#25334b":colors[owner];
   ctx.globalAlpha=owner<0?1:0.82;
   ctx.fillRect(x*C+1,y*C+1,C-2,C-2);
  }
 }
 ctx.globalAlpha=1;

 // Player trails
 for(const p of players){
  for(const cell of p.trail){
   const x=cell%N,y=Math.floor(cell/N);
   ctx.fillStyle=p.color;
   ctx.fillRect(x*C+2,y*C+2,C-4,C-4);
   ctx.strokeStyle="#ffffff";
   ctx.lineWidth=1;
   ctx.strokeRect(x*C+4,y*C+4,C-8,C-8);
  }
 }

 // Player characters
 for(const p of players){
  if(!p.alive)continue;
  const x=p.x*C+10,y=p.y*C+10;
  ctx.fillStyle="#ffffff";
  ctx.beginPath();
  ctx.arc(x,y,8,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle=p.color;
  ctx.lineWidth=4;
  ctx.stroke();
  ctx.fillStyle="#142238";
  ctx.font="bold 10px Arial";
  ctx.textAlign="center";
  ctx.fillText(p.index===0?"YOU":"BOT",x,y-13);
 }
 ctx.strokeStyle="#ffffff";
 ctx.lineWidth=3;
 ctx.strokeRect(1,1,598,598);
}

function gameLoop(){
 if(gameOver)return;
 tick++;

 // Move all players
 for(const p of players)move(p);

 updateStats();
 draw();
}

function setDirection(x,y){
 if(gameOver)return;
 if(x===-direction.x&&y===-direction.y)return;
 direction={x,y};
 players[0].dx=x;
 players[0].dy=y;
}

function bind(id,x,y){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  setDirection(x,y);
 });
}

bind("up",0,-1);
bind("down",0,1);
bind("left",-1,0);
bind("right",1,0);

document.getElementById("restart").onclick=()=>{
 clearInterval(timer);
 start();
 timer=setInterval(gameLoop,145);
};

let timer;
start();
timer=setInterval(gameLoop,145);
</script>
</body>
</html>
