
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HB Battle Royale</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  overflow: hidden;
  background: #87a9b8;
  font-family: Arial, sans-serif;
  touch-action: none;
}

canvas {
  display: block;
}

#loading {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #101d29;
  color: white;
  font-size: 20px;
}

#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  color: white;
  z-index: 5;
  text-shadow: 0 2px 5px black;
  font-weight: bold;
  pointer-events: none;
}

#title {
  font-size: 19px;
  letter-spacing: 2px;
}

#subtitle {
  font-size: 10px;
  margin-top: 5px;
  color: #d5e5e9;
}

#health {
  margin-top: 10px;
  width: 125px;
  height: 9px;
  border: 1px solid white;
  border-radius: 10px;
  overflow: hidden;
  background: #333;
}

#healthFill {
  height: 100%;
  width: 100%;
  background: #35dc75;
}

#controls {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

.control {
  position: absolute;
  bottom: 24px;
  width: 65px;
  height: 65px;
  border-radius: 18px;
  border: 2px solid rgba(255,255,255,.7);
  background: rgba(15,25,35,.55);
  color: white;
  font-size: 30px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
  user-select: none;
  touch-action: none;
  backdrop-filter: blur(5px);
}

.control:active,
.control.pressed {
  background: rgba(80,155,190,.8);
  transform: scale(.94);
}

#forward {
  left: 22px;
  bottom: 99px;
}

#backward {
  left: 22px;
}

#left {
  right: 99px;
}

#right {
  right: 22px;
}

#fullscreen {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 15;
  border: 1px solid white;
  border-radius: 9px;
  padding: 9px 12px;
  color: white;
  background: rgba(0,0,0,.5);
  font-size: 13px;
}

#rotateMessage {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 30;
  background: #101d29;
  color: white;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
  font-size: 20px;
}

@media (orientation: portrait) {
  #rotateMessage {
    display: flex;
  }
}
</style>
</head>

<body>

<div id="loading">Loading HB Battle Royale...</div>

<div id="hud">
  <div id="title">HB BATTLE ROYALE</div>
  <div id="subtitle">OPEN WORLD • MOBILE EDITION</div>
  <div id="health"><div id="healthFill"></div></div>
</div>

<button id="fullscreen">⛶ FULLSCREEN</button>

<div id="controls">
  <button class="control" id="forward">↑</button>
  <button class="control" id="backward">↓</button>
  <button class="control" id="left">↶</button>
  <button class="control" id="right">↷</button>
</div>

<div id="rotateMessage">
  Please rotate your phone horizontally to play HB Battle Royale.
</div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

/* ---------------- SCENE ---------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x9bbbc9);
scene.fog = new THREE.FogExp2(0x9bbbc9, 0.0028);

const camera = new THREE.PerspectiveCamera(
  65,
  innerWidth / innerHeight,
  0.1,
  1000
);

camera.position.set(0, 5, 10);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

document.body.appendChild(renderer.domElement);

/* ---------------- LIGHTING ---------------- */

const skyLight = new THREE.HemisphereLight(
  0xd8edff,
  0x536044,
  2.0
);
scene.add(skyLight);

const sun = new THREE.DirectionalLight(0xffe4bd, 3.0);
sun.position.set(-60, 100, 45);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -90;
sun.shadow.camera.right = 90;
sun.shadow.camera.top = 90;
sun.shadow.camera.bottom = -90;
sun.shadow.normalBias = 0.04;
scene.add(sun);

/* ---------------- MATERIALS ---------------- */

function material(color, roughness = 0.9, extra = {}) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    ...extra
  });
}

const grassMat = material(0x526d43);
const roadMat = material(0x343b40);
const concreteMat = material(0x777b7c);
const sandMat = material(0xc2ae83);
const trunkMat = material(0x59402d);
const leafMat = material(0x294b35);
const windowMat = material(0x456b7c, 0.25, {
  metalness: 0.35
});

/* ---------------- GROUND ---------------- */

const groundGeometry = new THREE.PlaneGeometry(
  320, 320, 90, 90
);

groundGeometry.rotateX(-Math.PI / 2);

const positions = groundGeometry.attributes.position;

for (let i = 0; i < positions.count; i++) {
  const x = positions.getX(i);
  const z = positions.getZ(i);

  const height =
    Math.sin(x * 0.035) * 1.8 +
    Math.cos(z * 0.04) * 1.5 +
    Math.sin((x + z) * 0.018) * 2.2;

  positions.setY(i, height);
}

groundGeometry.computeVertexNormals();

const ground = new THREE.Mesh(groundGeometry, grassMat);
ground.receiveShadow = true;
scene.add(ground);

/* ---------------- BEACH ---------------- */

const beach = new THREE.Mesh(
  new THREE.CircleGeometry(145, 80),
  sandMat
);

beach.rotation.x = -Math.PI / 2;
beach.position.y = -0.3;
beach.scale.set(1, 0.8, 1);
scene.add(beach);

/* ---------------- WATER ---------------- */

const waterMat = new THREE.MeshStandardMaterial({
  color: 0x287e9b,
  roughness: 0.24,
  metalness: 0.12,
  transparent: true,
  opacity: 0.91
});

const water = new THREE.Mesh(
  new THREE.PlaneGeometry(700, 700),
  waterMat
);

water.rotation.x = -Math.PI / 2;
water.position.y = -1.0;
scene.add(water);

/* ---------------- ROADS ---------------- */

function makeRoad(x, z, width, length, rotation = 0) {
  const road = new THREE.Mesh(
    new THREE.BoxGeometry(width, 0.13, length),
    roadMat
  );

  road.position.set(x, 0.05, z);
  road.rotation.y = rotation;
  road.receiveShadow = true;
  scene.add(road);

  const line = new THREE.Mesh(
    new THREE.BoxGeometry(0.16, 0.02, length),
    material(0xd5c99c)
  );

  line.position.set(x, 0.125, z);
  line.rotation.y = rotation;
  scene.add(line);
}

makeRoad(0, 0, 13, 190);
makeRoad(45, 20, 12, 150, Math.PI / 2);
makeRoad(-45, -25, 10, 140, Math.PI / 2);

/* ---------------- BUILDINGS ---------------- */

function makeBuilding(x, z, w, h, d, color) {
  const group = new THREE.Group();

  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    material(color, 0.85)
  );

  wall.position.y = h / 2;
  wall.castShadow = true;
  wall.receiveShadow = true;
  group.add(wall);

  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(w + 0.5, 0.5, d + 0.5),
    material(0x454a4c)
  );

  roof.position.y = h + 0.25;
  roof.castShadow = true;
  group.add(roof);

  const rows = Math.floor(h / 2.2);
  const columns = Math.max(2, Math.floor(w / 2.2));

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < columns; col++) {
      const windowMesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.85, 1.05, 0.08),
        windowMat
      );

      windowMesh.position.set(
        -w / 2 + (col + 0.7) * w / columns,
        1.4 + row * 2.2,
        d / 2 + 0.05
      );

      group.add(windowMesh);
    }
  }

  group.position.set(x, 0, z);
  scene.add(group);
}

const buildingColors = [
  0xb4a998,
  0x9caaa9,
  0x888b89,
  0xc2b9a7,
  0x777e80
];

for (let i = 0; i < 24; i++) {
  const x = (i % 6) * 13 - 39;
  const z = Math.floor(i / 6) * 18 - 28;

  if (Math.abs(x) < 12) continue;

  makeBuilding(
    x,
    z,
    7 + Math.random() * 4,
    6 + Math.random() * 15,
    7 + Math.random() * 4,
    buildingColors[i % buildingColors.length]
  );
}

/* ---------------- TREES ---------------- */

function makeTree(x, z, scale = 1) {
  const tree = new THREE.Group();

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(
      0.2 * scale,
      0.35 * scale,
      4 * scale,
      8
    ),
    trunkMat
  );

  trunk.position.y = 2 * scale;
  trunk.castShadow = true;
  tree.add(trunk);

  for (let i = 0; i < 7; i++) {
    const leaf = new THREE.Mesh(
      new THREE.SphereGeometry(
        1.3 * scale,
        8,
        6
      ),
      material(i % 2 ? 0x315b37 : 0x416b3c)
    );

    const angle = i * Math.PI * 2 / 7;

    leaf.position.set(
      Math.cos(angle) * scale,
      3.7 * scale + Math.random() * scale,
      Math.sin(angle) * scale
    );

    leaf.scale.set(1.1, 0.65, 1.1);
    leaf.castShadow = true;
    tree.add(leaf);
  }

  tree.position.set(x, 0, z);
  scene.add(tree);
}

for (let i = 0; i < 95; i++) {
  const x = (Math.random() - 0.5) * 260;
  const z = (Math.random() - 0.5) * 260;

  if (Math.abs(x) < 15 && Math.abs(z) < 20) continue;

  makeTree(x, z, 0.8 + Math.random() * 0.8);
}

/* ---------------- PLAYER ---------------- */

const player = new THREE.Group();
scene.add(player);

const skinMat = material(0xb88768);
const clothesMat = material(0x303c46);
const pantsMat = material(0x252e34);
const shoeMat = material(0x171b20);

function bodyPart(parent, geo, mat, x, y, z) {
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

bodyPart(
  player,
  new THREE.CapsuleGeometry(0.48, 0.9, 5, 10),
  clothesMat,
  0, 1.65, 0
);

bodyPart(
  player,
  new THREE.SphereGeometry(0.31, 16, 12),
  skinMat,
  0, 2.65, 0
);

bodyPart(
  player,
  new THREE.BoxGeometry(0.75, 0.18, 0.48),
  material(0x1b252c),
  0, 2.95, 0
);

const leftArm = bodyPart(
  player,
  new THREE.CapsuleGeometry(0.14, 0.68, 4, 8),
  clothesMat,
  -0.57, 1.85, 0
);

const rightArm = bodyPart(
  player,
  new THREE.CapsuleGeometry(0.14, 0.68, 4, 8),
  clothesMat,
  0.57, 1.85, 0
);

const leftLeg = bodyPart(
  player,
  new THREE.CapsuleGeometry(0.19, 0.7, 4, 8),
  pantsMat,
  -0.24, 0.65, 0
);

const rightLeg = bodyPart(
  player,
  new THREE.CapsuleGeometry(0.19, 0.7, 4, 8),
  pantsMat,
  0.24, 0.65, 0
);

bodyPart(
  player,
  new THREE.BoxGeometry(0.3, 0.17, 0.48),
  shoeMat,
  -0.24, 0.12, -0.1
);

bodyPart(
  player,
  new THREE.BoxGeometry(0.3, 0.17, 0.48),
  shoeMat,
  0.24, 0.12, -0.1
);

player.position.set(0, 0, 8);

/* ---------------- VEHICLES ---------------- */

function makeCar(x, z, color) {
  const car = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(3.3, 1, 5.5),
    material(color, 0.35, { metalness: 0.5 })
  );

  body.position.y = 0.9;
  body.castShadow = true;
  car.add(body);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(2.5, 1.1, 2.6),
    material(0x49616b, 0.25, { metalness: 0.3 })
  );

  cabin.position.set(0, 1.85, -0.2);
  car.add(cabin);

  const wheelMat = material(0x17191b);

  for (const side of [-1, 1]) {
    for (const front of [-1, 1]) {
      const wheel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.55, 0.55, 0.35, 16),
        wheelMat
      );

      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(side * 1.65, 0.55, front * 1.7);
      car.add(wheel);
    }
  }

  car.position.set(x, 0, z);
  scene.add(car);
}

makeCar(18, 10, 0x283e51);
makeCar(-18, -10, 0x6b342c);
makeCar(48, 28, 0x6e735f);

/* ---------------- CONTROLS ---------------- */

const keys = {
  forward: false,
  backward: false,
  left: false,
  right: false
};

function setupButton(id, key) {
  const button = document.getElementById(id);

  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys[key] = true;
    button.classList.add("pressed");
    button.setPointerCapture(e.pointerId);
  });

  function release(e) {
    keys[key] = false;
    button.classList.remove("pressed");
  }

  button.addEventListener("pointerup", release);
  button.addEventListener("pointercancel", release);
  button.addEventListener("lostpointercapture", release);
}

setupButton("forward", "forward");
setupButton("backward", "backward");
setupButton("left", "left");
setupButton("right", "right");

/* ---------------- KEYBOARD ---------------- */

addEventListener("keydown", e => {
  if (e.key === "w" || e.key === "ArrowUp") keys.forward = true;
  if (e.key === "s" || e.key === "ArrowDown") keys.backward = true;
  if (e.key === "a" || e.key === "ArrowLeft") keys.left = true;
  if (e.key === "d" || e.key === "ArrowRight") keys.right = true;
});

addEventListener("keyup", e => {
  if (e.key === "w" || e.key === "ArrowUp") keys.forward = false;
  if (e.key === "s" || e.key === "ArrowDown") keys.backward = false;
  if (e.key === "a" || e.key === "ArrowLeft") keys.left = false;
  if (e.key === "d" || e.key === "ArrowRight") keys.right = false;
});

/* ---------------- CAMERA ---------------- */

const cameraTarget = new THREE.Vector3();
const desiredCamera = new THREE.Vector3();

function updateCamera(delta) {
  const behind = new THREE.Vector3(
    Math.sin(player.rotation.y),
    0,
    Math.cos(player.rotation.y)
  );

  desiredCamera.set(
    player.position.x + behind.x * 8,
    player.position.y + 5.5,
    player.position.z + behind.z * 8
  );

  const smooth = 1 - Math.pow(0.001, delta);

  camera.position.lerp(desiredCamera, smooth);

  cameraTarget.set(
    player.position.x,
    player.position.y + 1.8,
    player.position.z
  );

  camera.lookAt(cameraTarget);
}

/* ---------------- FULLSCREEN ---------------- */

document.getElementById("fullscreen").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    }

    if (screen.orientation?.lock) {
      await screen.orientation.lock("landscape");
    }
  } catch (error) {
    console.log("Fullscreen or orientation lock unavailable");
  }
});

/* ---------------- GAME LOOP ---------------- */

const clock = new THREE.Clock();

let walkTime = 0;

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.04);

  const turnSpeed = 1.8;
  const moveSpeed = 9;

  if (keys.left) {
    player.rotation.y += turnSpeed * delta;
  }

  if (keys.right) {
    player.rotation.y -= turnSpeed * delta;
  }

  let moving = false;
  let direction = 0;

  if (keys.forward) {
    direction = -1;
    moving = true;
  }

  if (keys.backward) {
    direction = 1;
    moving = true;
  }

  if (moving) {
    player.position.x += Math.sin(player.rotation.y) *
      direction * moveSpeed * delta;

    player.position.z += Math.cos(player.rotation.y) *
      direction * moveSpeed * delta;

    walkTime += delta * 9;

    leftLeg.rotation.x = Math.sin(walkTime) * 0.45;
    rightLeg.rotation.x = -Math.sin(walkTime) * 0.45;

    leftArm.rotation.x = -Math.sin(walkTime) * 0.3;
    rightArm.rotation.x = Math.sin(walkTime) * 0.3;
  } else {
    leftLeg.rotation.x *= 0.85;
    rightLeg.rotation.x *= 0.85;
    leftArm.rotation.x *= 0.85;
    rightArm.rotation.x *= 0.85;
  }

  updateCamera(delta);

  water.position.y = -1 + Math.sin(clock.elapsedTime * 0.5) * 0.04;

  renderer.render(scene, camera);
}

/* ---------------- RESIZE ---------------- */

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
});

document.getElementById("loading").style.display = "none";

animate();

</script>
</body>
</html>
