<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HB Battle Royale</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101820;font-family:Arial;color:white}
#game{display:block;width:100vw;height:100vh}
#loading{position:fixed;inset:0;background:#101820;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:10;text-align:center;padding:25px}
#loading h2{color:#f5c542}
#controls{position:fixed;inset:0;pointer-events:none}
.pad{position:absolute;bottom:25px;display:flex;gap:12px;pointer-events:auto}
#leftPad{left:18px}
#rightPad{right:18px}
.control{width:68px;height:68px;border:2px solid #ffffffaa;border-radius:16px;background:#172b3dcc;color:white;font-size:27px;font-weight:bold;touch-action:none}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:auto}
#top button{background:#172b3dcc;color:white;border:1px solid white;border-radius:9px;padding:10px}
#title{font-weight:bold;color:#f5c542;text-shadow:1px 1px 3px black}
#hint{position:absolute;top:48px;left:12px;font-size:12px;text-shadow:1px 1px 3px black}
@media (orientation:portrait){#rotate{display:block}}
#rotate{display:none;position:fixed;bottom:110px;left:0;right:0;text-align:center;color:white;font-size:13px;text-shadow:1px 1px 3px black;pointer-events:none}
</style>
</head>
<body>
<div id="loading"><h2>HB BATTLE ROYALE</h2><p id="loadText">Loading city...</p></div>
<canvas id="game"></canvas>

<div id="controls">
  <div id="top">
    <span id="title">HB BATTLE ROYALE</span>
    <button id="full">FULL SCREEN</button>
  </div>
  <div id="hint">Move and explore the city</div>
  <div id="leftPad" class="pad">
    <button class="control" id="forward">↑</button>
    <button class="control" id="backward">↓</button>
  </div>
  <div id="rightPad" class="pad">
    <button class="control" id="turnLeft">↶</button>
    <button class="control" id="turnRight">↷</button>
  </div>
  <div id="rotate">For the best view, turn your phone sideways.</div>
</div>

<script type="module">
const loadText = document.getElementById("loadText");
function showError(message){
  document.getElementById("loading").style.display="flex";
  loadText.textContent="Could not load: "+message;
}
try {
  const THREE = await import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js");

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87b8d8);
  scene.fog = new THREE.Fog(0x87b8d8, 100, 260);

  const camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,500);
  const renderer = new THREE.WebGLRenderer({
    canvas:document.getElementById("game"),
    antialias:false,
    powerPreference:"low-power"
  });
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
  renderer.outputColorSpace=THREE.SRGBColorSpace;

  scene.add(new THREE.HemisphereLight(0xffffff,0x526044,2));
  const sun=new THREE.DirectionalLight(0xffffff,1.5);
  sun.position.set(60,100,40);
  scene.add(sun);

  const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(280,280),
    new THREE.MeshLambertMaterial({color:0x56794b})
  );
  ground.rotation.x=-Math.PI/2;
  ground.position.y=-0.1;
  scene.add(ground);

  // Roads
  const roadMat=new THREE.MeshLambertMaterial({color:0x30343a});
  const lineMat=new THREE.MeshBasicMaterial({color:0xe7dfbd});
  for(let p=-125;p<=125;p+=50){
    const road1=new THREE.Mesh(new THREE.PlaneGeometry(280,14),roadMat);
    road1.rotation.x=-Math.PI/2; road1.position.set(0,0,p); scene.add(road1);
    const road2=new THREE.Mesh(new THREE.PlaneGeometry(14,280),roadMat);
    road2.rotation.x=-Math.PI/2; road2.position.set(p,0.01,0); scene.add(road2);

    for(let x=-130;x<130;x+=12){
      const dash=new THREE.Mesh(new THREE.PlaneGeometry(5,0.22),lineMat);
      dash.rotation.x=-Math.PI/2; dash.position.set(x,0.03,p); scene.add(dash);
    }
    for(let z=-130;z<130;z+=12){
      const dash=new THREE.Mesh(new THREE.PlaneGeometry(0.22,5),lineMat);
      dash.rotation.x=-Math.PI/2; dash.position.set(p,0.03,z); scene.add(dash);
    }
  }

  // Shared building materials: created only four times to save phone memory.
  function makeFacade(base,lit){
    const c=document.createElement("canvas");
    c.width=128;c.height=256;
    const ctx=c.getContext("2d");
    ctx.fillStyle=base;ctx.fillRect(0,0,128,256);
    for(let y=9;y<250;y+=19){
      for(let x=8;x<125;x+=17){
        ctx.fillStyle=Math.random()<0.35?lit:"#172a3a";
        ctx.fillRect(x,y,9,11);
      }
    }
    const tex=new THREE.CanvasTexture(c);
    tex.colorSpace=THREE.SRGBColorSpace;
    return new THREE.MeshLambertMaterial({map:tex});
  }
  const facades=[
    makeFacade("#596875","#f4d99a"),
    makeFacade("#777b80","#ffe4a8"),
    makeFacade("#394c60","#f2d18a"),
    makeFacade("#777064","#f7e0a6")
  ];

  // City buildings
  const positions=[-100,-75,-25,25,75,100];
  let buildingCount=0;
  for(const x of positions){
    for(const z of positions){
      if(Math.abs(x)<35 && Math.abs(z)<35) continue;
      if(Math.random()<0.22) continue;
      const w=15+Math.random()*9;
      const d=15+Math.random()*9;
      const h=18+Math.random()*55;
      const mat=facades[Math.floor(Math.random()*facades.length)];
      const building=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
      building.position.set(x,h/2,z);
      scene.add(building);
      buildingCount++;
      // Rooftop block
      const roof=new THREE.Mesh(
        new THREE.BoxGeometry(w*0.35,2,d*0.35),
        new THREE.MeshLambertMaterial({color:0x343a40})
      );
      roof.position.set(x,h+1,z);
      scene.add(roof);
    }
  }

  // Small parks and trees
  const trunkMat=new THREE.MeshLambertMaterial({color:0x65452c});
  const leafMat=new THREE.MeshLambertMaterial({color:0x28643b});
  for(let i=0;i<24;i++){
    const x=(Math.random()-0.5)*230;
    const z=(Math.random()-0.5)*230;
    if(Math.abs(x%50)<12 || Math.abs(z%50)<12) continue;
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.7,4,6),trunkMat);
    trunk.position.set(x,2,z);scene.add(trunk);
    const leaves=new THREE.Mesh(new THREE.SphereGeometry(2.8,7,6),leafMat);
    leaves.position.set(x,5,z);scene.add(leaves);
  }

  // A few parked cars
  const carColors=[0xc83c32,0xd8d8d8,0x263c58,0xd6b84b];
  for(let i=0;i<8;i++){
    const car=new THREE.Group();
    const color=carColors[i%carColors.length];
    const body=new THREE.Mesh(
      new THREE.BoxGeometry(5,1.5,2.5),
      new THREE.MeshLambertMaterial({color})
    );
    body.position.y=1;car.add(body);
    const cabin=new THREE.Mesh(
      new THREE.BoxGeometry(2.5,1.1,2.1),
      new THREE.MeshLambertMaterial({color:0x8ca8b8})
    );
    cabin.position.y=2;car.add(cabin);
    car.position.set(-110+i*28,0,Math.random()<0.5?-7:7);
    scene.add(car);
  }

  // Player
  const player=new THREE.Group();
  const body=new THREE.Mesh(
    new THREE.CapsuleGeometry(0.8,1.3,4,8),
    new THREE.MeshLambertMaterial({color:0x263e75})
  );
  body.position.y=1.45;
  player.add(body);
  const head=new THREE.Mesh(
    new THREE.SphereGeometry(0.48,10,8),
    new THREE.MeshLambertMaterial({color:0xd5a27b})
  );
  head.position.y=2.65;
  player.add(head);
  player.position.set(0,0,0);
  scene.add(player);

  let movingForward=false,movingBack=false,turningLeft=false,turningRight=false;
  const speed=0.22,turnSpeed=0.045;

  function bindButton(id,setter){
    const el=document.getElementById(id);
    el.addEventListener("pointerdown",e=>{e.preventDefault();setter(true);});
    el.addEventListener("pointerup",()=>setter(false));
    el.addEventListener("pointercancel",()=>setter(false));
    el.addEventListener("pointerleave",()=>setter(false));
  }
  bindButton("forward",v=>movingForward=v);
  bindButton("backward",v=>movingBack=v);
  bindButton("turnLeft",v=>turningLeft=v);
  bindButton("turnRight",v=>turningRight=v);

  document.getElementById("full").onclick=()=>{
    if(document.documentElement.requestFullscreen)
      document.documentElement.requestFullscreen();
  };

  function resize(){
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
  }
  addEventListener("resize",resize);

  camera.position.set(0,7,12);
  camera.lookAt(player.position);

  document.getElementById("loading").style.display="none";

  function animate(){
    requestAnimationFrame(animate);
    if(turningLeft) player.rotation.y+=turnSpeed;
    if(turningRight) player.rotation.y-=turnSpeed;

    const direction=new THREE.Vector3(
      Math.sin(player.rotation.y),0,Math.cos(player.rotation.y)
    );
    if(movingForward) player.position.addScaledVector(direction,-speed);
    if(movingBack) player.position.addScaledVector(direction,speed);

    player.position.x=THREE.MathUtils.clamp(player.position.x,-130,130);
    player.position.z=THREE.MathUtils.clamp(player.position.z,-130,130);

    const behind=new THREE.Vector3(
      Math.sin(player.rotation.y)*10,
      6,
      Math.cos(player.rotation.y)*10
    );
    const target=player.position.clone().add(behind);
    camera.position.lerp(target,0.12);
    camera.lookAt(player.position.x,player.position.y+1.5,player.position.z);
    renderer.render(scene,camera);
  }
  animate();

} catch(error) {
  console.error(error);
  showError(error.message || "Please check your internet connection and try again.");
}
</script>
</body>
</html>
